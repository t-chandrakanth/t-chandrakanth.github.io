# Publishes a fully static export to GitHub Pages, so t-chandrakanth.github.io
# keeps serving this site after the repository stopped being a plain HTML page.
#
# ONE-TIME SETUP: Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Without that, Pages still tries to Jekyll-build the repo
# root and serves nothing.
#
# Vercel remains the primary deployment. This is a mirror; every page emits a
# canonical URL pointing at NEXT_PUBLIC_SITE_URL, so the mirror never competes
# with the primary domain in search.

name: Deploy static export to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          EXPORT_MODE: static
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://t-chandrakanth.github.io' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
